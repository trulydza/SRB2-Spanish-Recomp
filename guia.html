    const markdownText = "# SRB2 Recomp en Español — Guía del Proyecto\n\n> **Nombre del proyecto:** SRB2 Spanish Recomp\n> **Versión base:** SRB2 v2.2.15 (tag `SRB2_release_2.2.15`, commit `8701ef41`)\n> **Plataforma:** Windows 64-bit\n> **Autor:** Daza\n> **Última actualización:** 2026-10-09\n\n---\n\n## Índice\n\n1. [¿Qué es este proyecto?](#1-qué-es-este-proyecto)\n2. [Arquitectura y estrategia](#2-arquitectura-y-estrategia)\n3. [Estructura de carpetas](#3-estructura-de-carpetas)\n4. [Cómo compilar](#4-cómo-compilar)\n5. [Cómo editar traducciónes](#5-cómo-editar-traducciónes)\n6. [Reglas de traducción](#6-reglas-de-traducción)\n7. [Glosario de vocabulario fijado](#7-glosario-de-vocabulario-fijado)\n8. [Mapa de archivos fuente](#8-mapa-de-archivos-fuente)\n9. [Historial de lotes](#9-historial-de-lotes)\n10. [Lo que falta por traducir](#10-lo-que-falta-por-traducir)\n11. [Compatibilidad online](#11-compatibilidad-online)\n12. [Cómo jugar](#12-cómo-jugar)\n13. [Problemas conocidos y trampas](#13-problemas-conocidos-y-trampas)\n14. [FAQ](#14-faq)\n\n---\n\n## 1. ¿Qué es este proyecto?\n\nSRB2 (Sonic Robo Blast 2) tiene todos sus textos hardcodeados en C: menus, HUD, mensajes de confirmación, intermisiónes, titulares de nivel, etc. Un mod `.pk3` puede cambiar gráficos y agregar Lua/SOC, pero **no puede tocar esos strings en C**.\n\nEste proyecto **recompila el motor** con los textos traducidos al español. El resultado es un `srb2win_es.exe` que:\n\n- Muestra todo en español (menus, HUD, mensajes)\n- **Sigue siendo compatible con servidores vanilla** (puede jugar online)\n- Se complementa con un `.pk3` cosmético para los gráficos traducidos\n\n### Origen\n\nDaza ya tenia un mod de traducción (`srb2_spanish.pk3`) con:\n- Graficos de menu/HUD traducidos\n- Lua scripts para el HUD en juego (`hud_es.lua`, `titlecard_es.lua`)\n- SOC para nombres de niveles, unlockables, cutscenes\n\nEl problema: **el Lua y SOC bloquean el multijugador** (el servidor exige que todos tengan los mismos archivos). La recomp mueve todo lo posible a C para que funcione online.\n\n---\n\n## 2. Arquitectura y estrategia\n\n```\n┌─────────────────────────────────────────────┐\n│              JUEGO TRADUCIDO                │\n├──────────────────┬──────────────────────────┤\n│  srb2win_es.exe  │  srb2_spanish_gfx.pk3   │\n│  (motor en C)    │  (gráficos cosméticos)   │\n│                  │                          │\n│  • Menus         │  • Cabeceras de menu     │\n│  • HUD           │  • Iconos HUD            │\n│  • Mensajes      │  • Fuentes graficas      │\n│  • Intermisiones │  • Parches visuales      │\n│  • Titlecards    │                          │\n│  • Unlockables   │  72 archivos, todos      │\n│                  │  lumps cosméticos        │\n├──────────────────┴──────────────────────────┤\n│  RESULTADO: Compatible con servidores       │\n│  vanilla. Puede jugar online.               │\n└─────────────────────────────────────────────┘\n```\n\n### ¿Qué va en cada parte?\n\n| Contenido | Donde vive | Por que |\n|---|---|---|\n| Textos de menu, HUD, mensajes | C (exe recompilado) | No se pueden cambiar con pk3 |\n| Graficos de menu/HUD | pk3 cosmético | Lumps cosméticos no bloquean MP |\n| Nombres de niveles (SOC) | C (tablas de traducción) | SOC bloquea MP |\n| Lua de HUD | C (portado) | Lua bloquea MP |\n| Cutscenes/Tutorial (SOC) | Pendiente de portar a C | SOC bloquea MP |\n\n---\n\n## 3. Estructura de carpetas\n\n```\nC:\\Users\\Daza\\Documents\\SRB2-recomp-copy\\\n├── SRB2\\                          ← Código fuente (tag 2.2.15)\n│   ├── src\\                       ← Archivos .c/.h editados\n│   │   ├── m_menu.c               ← Menus (el archivo mas editado)\n│   │   ├── st_stuff.c             ← HUD in-game\n│   │   ├── y_inter.c              ← Pantallas de intermisión\n│   │   ├── f_finale.c             ← Creditos, intro, continue\n│   │   ├── deh_soc.c              ← Parser SOC + tabla M_UnlockTr\n│   │   ├── m_cond.c               ← Condiciones de desbloqueo\n│   │   ├── g_game.c               ← Records, replays, mensajes\n│   │   ├── p_inter.c              ← Mensajes de combate/items\n│   │   └── command.c              ← Cvars (On/Off/Yes/No)\n│   ├── bin\\                       ← Salida del build\n│   │   └── srb2win64.exe          ← Exe recien compilado\n│   └── libs\\                      ← DLLs del proyecto\n│\n├── dist\\                          ← DISTRIBUCION LISTA\n│   ├── srb2win_es.exe             ← Exe actual (ultimo build)\n│   ├── srb2win_es_p1.exe          ← Snapshot lote 1\n│   ├── srb2win_es_p2.exe          ← Snapshot lote 2\n│   ├── srb2win_es_p3.exe          ← Snapshot lote 3\n│   ├── srb2win_es_p4.exe          ← Snapshot lote 4\n│   ├── srb2win_es_p5.exe          ← Snapshot lote 5\n│   ├── srb2win_es_p6.exe          ← Snapshot lote 6\n│   ├── srb2win_es_p7.exe          ← Snapshot lote 7\n│   ├── srb2win_es_p8.exe          ← Snapshot lote 8\n│   ├── srb2win_es_p9.exe          ← Snapshot lote 9\n│   ├── srb2win_es_p11.exe         ← Snapshot lote 10\n│   ├── srb2win_es_p11.exe         ← Snapshot lote 11 (actual)\n│   ├── *.dll                      ← Todas las DLLs necesarias\n│   ├── Jugar_online.bat           ← Exe + pk3 cosmético (MP)\n│   ├── Jugar_traducido.bat        ← Exe + mod completo (offline)\n│   └── Jugar_vanilla.bat          ← Exe sin mod\n│\n├── build_patch1.log ... patch7.log ← Logs de cada build\n└── guia.html                      ← Documentacion central del proyecto (este archivo)\n```\n\n### Carpetas externas (SOLO LECTURA)\n\n| Carpeta | Contenido | Regla |\n|---|---|---|\n| `C:\\Users\\Daza\\SRB2 v2.2` | Juego original, saves, gamedata.dat | **NUNCA TOCAR** |\n| `C:\\Users\\Daza\\Documents\\SRB2 Español\\` | Mod original srb2_spanish.pk3 | Solo lectura |\n\n---\n\n## 4. Cómo compilar\n\n### Requisitos\n\n- **MSYS2** instalado en `C:\\msys64`\n- Toolchain **MinGW-w64 x86_64** (64-bit)\n- Paquetes: `mingw-w64-x86_64-gcc`, `make`, `mingw-w64-x86_64-SDL2`, `mingw-w64-x86_64-libgme`, `mingw-w64-x86_64-libopenmpt`\n\n### Comando de build\n\nDesde una terminal MSYS2 MinGW64, o con el siguiente argv:\n\n```bash\n# Opción 1: Desde MSYS2 MinGW64 terminal\ncd /c/Users/Daza/Documents/SRB2-recomp-copy/SRB2\nCFLAGS=\"-Wno-error=incompatible-pointer-types\" make -C src MINGW64=1 -j4\n\n# Opción 2: Desde Windows (argv para herramientas)\nC:\\msys64\\usr\\bin\\env.exe MSYSTEM=MINGW64 \\\n  CFLAGS=-Wno-error=incompatible-pointer-types \\\n  C:\\msys64\\usr\\bin\\bash.exe -lc \\\n  \"cd /c/Users/Daza/Documents/SRB2-recomp-copy/SRB2 && make -C src MINGW64=1 -j4\"\n```\n\n> **Importante:** El flag `-Wno-error=incompatible-pointer-types` es necesario porque GCC 16 trata esos warnings como error y el código de SRB2 (2025) los tiene.\n\n### Despues del build\n\n```bash\n# Copiar exe a dist (sobrescribir)\ncp SRB2/bin/srb2win64.exe dist/srb2win_es.exe\n\n# Guardar snapshot con número de lote (no sobrescribir si existe)\ncp -n dist/srb2win_es.exe dist/srb2win_es_p8.exe\n\n# Verificar\nmd5sum dist/srb2win_es.exe dist/srb2win_es_p8.exe\n```\n\n### Build incremental\n\nSolo recompila los archivos modificados. Tarda ~1-3 minutos.\n\n### Build limpio (si algo falla)\n\n```bash\ncd /c/Users/Daza/Documents/SRB2-recomp-copy/SRB2\nmake -C src MINGW64=1 clean\nCFLAGS=\"-Wno-error=incompatible-pointer-types\" make -C src MINGW64=1 -j4\n```\n\n---\n\n## 5. Cómo editar traducciónes\n\n### Metodo seguro: Script Python con validacion\n\nTodos los lotes se hicieron con un script Python que:\n\n```python\nimport sys\n\npath = r\"C:\\Users\\Daza\\Documents\\SRB2-recomp-copy\\SRB2\\src\\ARCHIVO.c\"\n\nwith open(path, 'rb') as f:\n    data = f.read()\n\n# Detectar fin de linea\nnl = b'\\r\\n' if b'\\r\\n' in data else b'\\n'\n\n# PASO 1: Validar que el texto original existe y aparece N veces\noriginal = b'\"TEXTO ORIGINAL\"'\nassert data.count(original) == 1, f\"Esperaba 1, encontre {data.count(original)}\"\n\n# PASO 2: Reemplazar\ndata = data.replace(original, b'\"TEXTO TRADUCIDO\"')\n\n# PASO 3: Escribir solo si todo valido\nwith open(path, 'wb') as f:\n    f.write(data)\n\nprint(\"OK\")\n```\n\n### ¿Por qué este método?\n\n- Si el texto original cambio o no existe, el `assert` falla y **no se escribe nada**\n- Preserva los finales de linea (`\\r\\n` en Windows)\n- Se puede ejecutar con `python` desde Windows\n\n### Alternativa: Edicion directa\n\nPara cambios simples, se puede editar directamente con cualquier editor. Pero **siempre verificar con grep** antes:\n\n```bash\ngrep -n 'TEXTO_ORIGINAL' src/ARCHIVO.c\n```\n\n---\n\n## 6. Reglas de traducción\n\n### Caracteres permitidos\n\n| Permitido | Prohibido |\n|---|---|\n| ASCII 32-126 (letras sin acento, números, símbolos básicos) | Tildes (á, é, í, ó, ú) |\n| Códigos de control del motor (`\\x82`, `\\x83`, etc.) | Eñe (ñ) |\n| | Signos de apertura (¿, ¡) |\n\n> El font de SRB2 solo tiene glifos hasta ASCII 126. Para tildes se necesitaria un parche de font (pendiente, ver sección 10).\n\n### Estilo\n\n- **Resumir si es largo.** El usuario prefiere textos cortos que quepan en la pantalla. Ejemplo: `\"Complete 1P mode with all emeralds\"` → `\"Completa 1P con todas las esmeraldas\"`.\n- **No traducir literal** si no suena natural en español.\n- **Preguntas sin signo de apertura:** `\"Seguro que quieres salir?\"` (no `\"¿Seguro...?\"`)\n\n### Cosas que NO se tocan\n\n| Que | Ejemplo | Por que |\n|---|---|---|\n| Format specifiers | `%d`, `%s`, `%hu`, `%hd` | El motor los necesita |\n| Newlines | `\\n` | Estructura del texto |\n| Códigos de color | `\\x82` (amarillo), `\\x83` (verde), `\\x85` (rojo), `\\x80` (blanco) | Formateo visual |\n| Flechas de ejes | `\\x17`, `\\x18` | Iconos del gamepad |\n| Teclas de confirmación | `'Y'` / `'N'` | El motor lee las teclas fisicas Y/N, nunca S |\n\n### Cuidado con hex despues de `\\xNN`\n\nSi el caracter que sigue a un `\\xNN` es un digito hex (0-9, a-f, A-F), el compilador lo interpreta como parte del escape. Solucion: cerrar y reabrir el string.\n\n```c\n// MAL: \\x82Etapa → se lee como \\x82E (0x82E no existe)\n\"\\\\x82Etapa Especial\"\n\n// BIEN: separar el string\n\"\\\\x82\"\"Etapa Especial\"\n```\n\n### Buffers con tamaño fijo\n\nAlgunos strings van a arrays con tamaño fijo. **No exceder el limite:**\n\n| Variable | Tamaño max | Donde |\n|---|---|---|\n| `passed1` | 21 chars | `y_inter.c` (nombre del personaje en intermisión) |\n| `passed2` | 16 chars | `y_inter.c` (texto de estado coop: `\"zona completa\"` = 13 chars, OK) |\n| `spec.passed2` | 17 chars | `y_inter.c` (Special Stage: `\"Etapa Especial\"` = 14 chars, OK) |\n| `unlockables[].name` | 64 chars | `deh_soc.c` |\n| `unlockables[].objective` | 64 chars | `deh_soc.c` |\n| `levelname` | 22 chars | `deh_soc.c` (limite del header SOC) |\n\n---\n\n## 7. Glosario de vocabulario fijado\n\nEstas traducciónes ya estan aplicadas en el código y deben mantenerse consistentes:\n\n| Ingles | Español | Notas |\n|---|---|---|\n| Zone | Zona | |\n| Act | Acto | |\n| Ring | Anillo | |\n| Spin | Girar | |\n| Add-ons | Complementos | |\n| Record Attack | Contrarreloj | |\n| Item Monitors | Monitores | |\n| Starposts | Checkpoints | |\n| Special Stage | Etapa Especial | |\n| Options | Opciónes | |\n| Multiplayer | Multijugador | |\n| 1 Player | 1 Jugador | |\n| Quit | Salir | |\n| Secrets | Extras | |\n| Pandora's Box | Caja de Pandora | |\n| Emblem Hints | Pistas de emblemas | |\n| Pause | Pausa | |\n| Sound Test | Prueba de sonido | |\n| Lives | Vidas | (no aparece como texto, es gráfico) |\n| Emerald | Esmeralda | |\n| Save | Guardar / Partida guardada | segun contexto |\n| Continue | Continuar | en menus de pausa |\n| Game Over | Game Over | se mantiene en ingles (es marca) |\n\n---\n\n## 8. Mapa de archivos fuente\n\nQue archivo controla que parte del juego:\n\n| Archivo | Que contiene | Lineas aprox. |\n|---|---|---|\n| `src/m_menu.c` | **Todo el sistema de menus**: principal, submenus, opciónes, Record Attack, NiGHTS, Marathon, servidor, controles, video, sonido, datos, partidas guardadas, quit messages, mensajes de confirmación, estadisticas | ~14000 |\n| `src/st_stuff.c` | **HUD in-game**: SCORE/TIME/RINGS (gráficos), titlecard (Zona/Acto), NiGHTS HUD, Game Over, textos de estado, overtime | ~2900 |\n| `src/y_inter.c` | **Intermisiones**: pantalla post-nivel (coop, match, CTF, competition, special stage), conteo de puntaje | ~1400 |\n| `src/f_finale.c` | **Finale/credits**: texto de introduccion (16 paginas), creditos, pantalla Continue, evaluacion final, Marathon, cutscenes | ~4700 |\n| `src/deh_soc.c` | **Parser SOC**: lee los archivos SOC del pk3. Aqui vive la tabla `M_UnlockTr()` para traducir unlockables | ~3500 |\n| `src/m_cond.c` | **Condiciones de desbloqueo**: lógica de unlockables y mensaje de \"desbloqueado!\" | ~400 |\n| `src/g_game.c` | **Logica del juego**: records, replays, mensajes de consola (NEW RECORD, Earned emblems) | ~4000 |\n| `src/p_inter.c` | **Interaccion de jugadores**: mensajes de muerte/combate, CTF flags, power-ups NiGHTS | ~2200 |\n| `src/command.c` | **Cvars**: valores On/Off/Yes/No/True/False (delicado, la consola los parsea) | ~1700 |\n| `src/hu_stuff.c` | **Chat y mensajes HUD**: comandos say/sayteam/csay | ~700 |\n\n---\n\n## 9. Historial de lotes\n\nCada lote es un conjunto de traducciónes que se hicieron juntas, compilaron y guardaron como snapshot.\n\n### Lote 1 — Menu principal\n- **Archivo:** `m_menu.c`\n- **Exe:** `dist/srb2win_es_p1.exe`\n- **Contenido:** Menu principal (1 Jugador, Multijugador, Complementos, Opciónes, Salir). Level Select: `ACT %d` → `ACTO %d`, `THE ACT` → `EL ACTO`.\n- **Verificado:** Si (usuario confirmo visualmente)\n\n### Lote 2 — Submenus\n- **Archivo:** `m_menu.c`\n- **Exe:** `dist/srb2win_es_p2.exe`\n- **Contenido:** Submenus de 1 Jugador, Multijugador, Opciónes (principal, controles J1/J2), menus de pausa SP y MP.\n- **Verificado:** Si\n\n### Lote 3 — Controles y opciónes avanzadas\n- **Archivo:** `m_menu.c`\n- **Exe:** `dist/srb2win_es_p3.exe`\n- **Contenido:** Lista de controles, gamepad, Video, Sonido, Datos (capturas de pantalla, borrar datos).\n- **Verificado:** Si (\"se ve buenisimo\")\n\n### Lote 4 — Extras y desbloqueables\n- **Archivos:** `deh_soc.c`, `m_menu.c`, `m_cond.c`\n- **Exe:** `dist/srb2win_es_p4.exe`\n- **Contenido:** Tabla `M_UnlockTr()` con 27 nombres + 24 objetivos de unlockables, aplicada al parser SOC. Caja de Pandora. Pistas de emblemas. Aviso \"desbloqueado!\". Nombres de zona del mod del usuario.\n- **Verificado:** Parcialmente (no se ha visto en pantalla si todo cabe)\n\n### Lote 5 — Opciónes adicionales\n- **Archivo:** `m_menu.c`\n- **Exe:** `dist/srb2win_es_p5.exe`\n- **Contenido:** Mouse, Camara, Color, OpenGL, Servidor, Monitores sorpresa (resumidos).\n- **Verificado:** No (visualmente)\n\n### Lote 6 — Mensajes y confirmaciónes\n- **Archivo:** `m_menu.c`\n- **Exe:** `dist/srb2win_es_p6.exe`\n- **Contenido:** Record Attack/NiGHTS/Marathon, Multijugador, ~35 mensajes de confirmación (`M_StartMessage`), etiquetas dibujadas (`\"Juego en pausa\"`, `\"Pulsa ESC para salir\"`).\n- **Verificado:** No (visualmente)\n\n### Lote 7 — HUD y intermisiónes\n- **Archivos:** `st_stuff.c`, `y_inter.c`\n- **Exe:** `dist/srb2win_es_p7.exe` (= `dist/srb2win_es.exe` actual)\n- **Contenido:**\n  - HUD: coordenadas de `hudinfo` ajustadas para textos mas largos\n  - Titlecard: `Zone` → `Acto`/`Zona` segun tenga actnum\n  - Intermision coop: nombre real del personaje + `\"completo acto\"` / `\"zona completa\"`\n  - Special Stage: `\"Etapa Especial\"`, `\"obtuvo las 7!\"`, `\"ya puede ser\"`, `\"su forma Super\"`, `\"una Esmeralda\"`\n- **Verificado:** No (no se ha visto alineacion del HUD en pantalla)\n\n### Lote 8 — Prioridad Alta (Load Game, Records, HUD NiGHTS, Continue, Rebind, Quit Messages)\n- **Archivos:** `m_menu.c`, `st_stuff.c`, `f_finale.c`\n- **Exe:** `dist/srb2win_es_p8.exe` (= `dist/srb2win_es.exe` actual)\n- **Contenido:**\n  - Load Game: `NUEVA PARTIDA`, `NO GUARDAR`, `ADDON NO CARGADO`, `ERROR AL CARGAR`, `COMPLETADO!`\n  - Etiquetas: `PUNTAJE:`, `TIEMPO:`, `ANILLOS:`, `(ninguno)`, `RECORD PTS:`, `MEJOR TIEMPO:` (en pistas de emblemas, Record Attack, NiGHTS stats y estadisticas)\n  - Continue screen: `\"Continuar?\"`\n  - Controles y tutorial: avisos de cambio de controles y jugador 2\n  - HUD in-game y NiGHTS: `\"LLEGA A LA META!\"`, `\"MULTIPLICADOR DE PUNTAJE!\"`, `\"ESFERAS:\"`, `\"FICHAS:\"`, `\"TERMINADO!\"`, `\"Vuelta:\"`, `\"PUNTO DE VISTA: Cambiar vista\"`, `\"Modo espectador:\"`, `\"TIEMPO EXTRA!\"`\n  - Quit messages: las 22/24 frases humoristicas adaptadas con `(Pulsa 'Y' para salir)`\n- **Verificado:** Compilado e integrado\n\n### Lote 9 — Prioridad Media (Intermision MP y Mensajes de Consola)\n- **Archivos:** `y_inter.c`, `g_game.c`\n- **Exe:** `dist/srb2win_es_p9.exe` (= `dist/srb2win_es.exe` actual)\n- **Contenido:**\n  - Intermision multijugador: cabeceras de columnas traducidas (`NOMBRE`, `PUNTAJE`, `TIEMPO`, `AROS`, `TOTAL`, `CAJA`, `PTS`)\n  - Avisos en pantalla: `\"empieza en %d segundos\"` y `\"Los equipos se mezclaran la proxima ronda!\"`\n  - Mensajes de consola / records: `\"NUEVO RECORD DE TIEMPO!\"`, `\"NUEVO RECORD DE PUNTAJE!\"`, `\"NUEVO RECORD DE ANILLOS!\"`, `\"Replay guardado como\"`\n  - Emblemas ganados: por Contrarreloj, NiGHTS y completar nivel\n  - Avisos de reinicio: para jugar Contrarreloj y guardar progreso\n- **Verificado:** Compilado e integrado\n\n### Lote 10 — Prioridad Baja (Intro Narrativa, Creditos y Maraton)\n- **Archivo:** `f_finale.c`\n- **Exe:** `dist/srb2win_es_p11.exe` (= `dist/srb2win_es.exe` actual)\n- **Contenido:**\n  - Introduccion narrativa: las 16 paginas de la historia portadas al motor respetando los códigos de tiempo y estructura del mod original\n  - Creditos: cabeceras de sección traducidas (`Creditos`, `Diseño del juego`, `Programacion`, `Arte`, `Musica y diseño sonoro`, `Diseño de niveles`, `Diseño de jefes`, `Control de calidad`, `Agradecimientos especiales`, `Producido por`, `Publicado por`, `Gracias por jugar!`)\n  - Pantalla de Maraton: `Tiempo in-game`, `Tiempo RTA`, `con cinematicas`\n- **Verificado:** Compilado e integrado\n\n### Lote 11 — Prioridad Alta (Nombres de Niveles y Subtitulos SOC en C)\n- **Archivo:** `deh_soc.c`\n- **Exe:** `dist/srb2win_es_p11.exe` (= `dist/srb2win_es.exe` actual)\n- **Contenido:**\n  - Nombres de los 66 niveles vanilla traducidos de forma nativa en el parser SOC (`readlevelheader`) usando la tabla `M_LevelTr()`. (Ej: `Colina Tecno`, `Mar Profundo`, `Castillo De Eggman`, `Canon Arido`, `Volcan Rojo`, `Nucleo Negro`, `Ladera Helada`, `Torres de Tuberias`, etc.).\n  - Subtitulos de etapas traducidos mediante `M_LevelSubTr()` (`Etapa Especial 1` a `8`).\n  - Totalmente compatible con netplay y servidores vanilla al no requerir archivos SOC externos.\n- **Verificado:** Compilado e integrado\n\n---\n\n## 10. Lo que falta por traducir\n\n> ✅ **Prioridad ALTA completada (Lote 8):** Load Game (`NUEVA PARTIDA`, `NO GUARDAR`, `COMPLETADO!`), Etiquetas de records/stats (`PUNTAJE:`, `TIEMPO:`, `ANILLOS:`, `(ninguno)`), Continue (`\"Continuar?\"`), Rebind controls prompt, Quit messages (24 frases humoristicas) y HUD NiGHTS/espectador/carreras/overtime.\n\n> ✅ **Prioridad MEDIA completada (Lote 9):** Cabeceras intermisión MP (`NOMBRE`, `PUNTAJE`, `TIEMPO`, `AROS`, `CAJA`, `PTS`), alertas de scramble/inicio y mensajes de consola por nuevos records y obtencion de emblemas.\n\n> ✅ **Prioridad BAJA completada (Lote 10):** Intro narrativa (16 paginas de historia en C), cabeceras de creditos y pantalla de Maraton.\n\n> ✅ **Prioridad ALTA completada (Lote 11):** Nombres de los 66 niveles vanilla y subtitulos de etapas especiales integrados de forma nativa en `deh_soc.c`.\n\n### Pendiente restante\n\n| # | Que | Donde | Dificultad |\n|---|---|---|---|\n| 10 | Tutorial prompts SOC en C (opciónal, textos guiados en mapa de tutorial) | `deh_soc.c` | Media |\n\n### Evaluar con el usuario\n\n| # | Que | Por que esperar |\n|---|---|---|\n| 14 | Mensajes de combate Ringslinger (~50 strings en `p_inter.c`) | Excluidos a proposito; modos de nicho |\n| 15 | On/Off/Yes/No de cvars (`command.c:78-82`) | Riesgo de romper consola/config.cfg |\n| 16 | Parche de font para tildes y ene | Requiere crear glifos nuevos como lumps |\n\n---\n\n## 11. Compatibilidad online\n\n### ¿Cómo funciona?\n\nSRB2 clasifica los archivos del pk3 en dos categorias:\n\n- **Cosmeticos** (gráficos, sonidos de menu, fuentes): el servidor los ignora, cada cliente puede tener los suyos\n- **Importantes** (Lua, SOC, mapas): el servidor exige que sean identicos\n\nLa funcion `W_VerifyNMUSlumps` en `src/w_wad.c` tiene la lista blanca de prefijos cosméticos:\n`M_`, `TTL`, `STT`, `LT`, `CONT`, `STCFN`, `K_ST`, `INTERSCR`, `TITLSCR`, etc.\n\n### ¿Qué significa para nosotros?\n\n- Los textos hardcodeados en C van **dentro del exe**: el servidor no compara exes, solo WADs/pk3\n- Los gráficos del pk3 cosmético tienen prefijos en la lista blanca: **no bloquean**\n- El Lua y SOC del mod original **si bloquean**: por eso se portan a C\n\n### Confirmado\n\n- El usuario entro a servidores vanilla con el exe traducido sin mod ✓\n- Pendiente confirmar con `Jugar_online.bat` (exe + pk3 cosmético)\n\n---\n\n## 12. Cómo jugar\n\n### Modo online (compatible con servidores)\n\nUsar `dist\\Jugar_online.bat`:\n```batch\n@echo off\nstart \"\" \"srb2win_es.exe\" -file addons\\srb2_spanish_gfx.pk3\n```\nCarga el exe traducido + gráficos cosméticos. Puede entrar a cualquier servidor vanilla.\n\n### Modo traducción completa (offline)\n\nUsar `dist\\Jugar_traducido.bat`:\n```batch\n@echo off\nstart \"\" \"srb2win_es.exe\" -file \"RUTA_AL_MOD\\srb2_spanish.pk3\"\n```\nCarga todo: exe traducido + mod completo con Lua/SOC. Solo para jugar solo.\n\n### Modo exe solo (sin mods)\n\nUsar `dist\\Jugar_vanilla.bat`:\nCorre el exe traducido sin ningun mod adicional. Los menus y HUD estan en español; los gráficos de cabecera siguen en ingles.\n\n### Datos del juego\n\nEl exe en `dist\\` guarda su config y saves **separados** del juego original. No comparte `gamedata.dat` ni saves con la instalacion en `C:\\Users\\Daza\\SRB2 v2.2`.\n\n---\n\n## 13. Problemas conocidos y trampas\n\n### Entorno de build\n\n| Problema | Solucion |\n|---|---|\n| `bash -s` no encuentra `sed`, `grep`, etc. | Usar `bash -lc` (login shell) |\n| `git` no esta en el PATH de MSYS2 | Usar `git` de Windows directamente |\n| `python` no existe en MSYS bash | Invocar `python` desde Windows |\n| `find /` cuelga la herramienta | No escanear fuera de las carpetas del proyecto |\n| Numeros de linea de notas anteriores pueden variar | Siempre verificar con grep, no confiar ciegamente en números de linea |\n\n### Código\n\n| Problema | Solucion |\n|---|---|\n| `#ifdef ALAM_LIGHTING` tiene menus OpenGL | No traducir: esta desactivado en vanilla |\n| `grep` del exe no encuentra strings | GCC compila `strcpy` con inmediatos de 8 bytes; el texto no esta contiguo. Buscar trozos cortos o confiar en el diff |\n| Hex despues de `\\xNN` se come la siguiente letra | Cerrar y reabrir el string: `\"\\x82\"\"Texto\"` |\n| `M_GetText()` parece una funcion de i18n | Es un **stub** que devuelve el mismo string. No traduce nada |\n\n### Traducción\n\n| Problema | Solucion |\n|---|---|\n| La fuente del juego no tiene tildes | Usar ASCII sin acentos: `Tamaño`, `Opción`, etc. |\n| Confirmaciones con Y/N | El motor lee la tecla fisica. Escribir `'Y'`/`'N'`, nunca `'S'` |\n| Textos de menu con `strcmp` | Se verifico: `m_menu.c` NO compara strings de menu por contenido |\n| `config.cfg` guarda valores de cvars como texto | No traducir `\"On\"`/`\"Off\"` en `command.c` sin separar display de parse |\n\n---\n\n## 14. FAQ\n\n### ¿Se pueden agregar tildes o la letra ñ?\n\nTodavia no. Se necesita crear glifos nuevos (lumps `STCFN161`, etc.) y modificar el renderer de texto para aceptar caracteres > ASCII 126. Esta en la lista de pendientes como \"parche de font\".\n\n### Si modifico un archivo .c, ¿tengo que recompilar todo?\n\nNo. El build es incremental: solo recompila los `.c` que cambiaron. Tarda 1-3 minutos.\n\n### ¿Se puede jugar online con la traducción?\n\nSi, usando `Jugar_online.bat`. El exe traducido es compatible con servidores vanilla. El pk3 cosmético no bloquea la conexion.\n\n### ¿Hay riesgo de romper algo al traducir?\n\nSi. Los riesgos principales son:\n1. **Exceder un buffer** (ej. meter mas de 21 chars en `passed1`)\n2. **Romper un format specifier** (borrar un `%d` o `%s`)\n3. **Romper un escape hex** (poner una letra hex despues de `\\xNN`)\n4. **Traducir algo que la consola parsea** (ej. `\"On\"`/`\"Off\"` en cvars)\n\nPor eso se usa el script Python con `assert` antes de escribir.\n\n### ¿Dónde están los respaldos o versiónes anteriores?\n\nEn `dist\\`:\n- `srb2win_es_p1.exe` hasta `srb2win_es_p11.exe`\n- `srb2win_es.exe` = ultimo build (copia del p10)\n\nSi algo sale mal, se puede volver a cualquier snapshot anterior.\n\n### ¿Qué pasará cuando SRB2 se actualice?\n\nEste proyecto esta basado en el tag `SRB2_release_2.2.15`. Si sale una versión nueva, habría que:\n1. Crear un nuevo branch desde el tag nuevo\n2. Re-aplicar los parches (idealmente como commits cherry-pickable)\n3. Resolver conflictos\n\nPor ahora no es un problema porque 2.2.15 es la versión estable actual.\n";
